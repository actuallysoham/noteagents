<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Coming soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500&display=swap" rel="stylesheet">
  <style>
    :root { --paper: #faf8f4; --ink: #1c2130; --line: rgba(28, 33, 48, 0.12); }
    @media (prefers-color-scheme: dark) {
      :root { --paper: #13161d; --ink: #ecebe6; --line: rgba(236, 235, 230, 0.12); }
    }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh;
      display: grid; place-items: center; padding: 16px;
      background-color: var(--paper);
      background-image: radial-gradient(var(--line) 1px, transparent 1px);
      background-size: 22px 22px;
      color: var(--ink);
    }
    h1 {
      margin: 0; text-align: center;
      font: 500 clamp(40px, 8vw, 72px)/1.05 "Newsreader", Georgia, serif;
      letter-spacing: -0.02em;
    }
  </style>
</head>
<body>
  <h1>Coming soon</h1>
</body>
</html>
